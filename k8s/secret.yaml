apiVersion: v1
kind: Secret
metadata:
  name: shop-app-secret
  namespace: shop-app
type: Opaque
stringData:
  DB_PASSWORD: "your_db_password_here"
  JWT_SECRET: "your_jwt_secret_here"
  GOOGLE_CLIENT_ID: "your_google_client_id_here"
  DATABASE_URL: "postgresql://shop_user:your_db_password_here@postgres:5432/shop_db?schema=public"
